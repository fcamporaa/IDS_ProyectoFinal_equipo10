{% extends "layout.html" %}

{% block content %}
<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card" style="background-color: #1c1c1c; border: 1px solid #333;">
                <div class="card-header" style="border-bottom: 2px solid #e50914; background-color: #111;">
                    <h4 style="color: white; margin: 0; font-weight: bold;">
                        {{ 'Editar Función' if funcion else 'Crear Nueva Función' }}
                    </h4>
                </div>
                <div class="card-body p-4">
                    <!-- Si hay función, la ruta apunta a editar; si no, a crear -->
                    <form action="{{ url_for('admin_funciones.editar_funcion', id_funcion=funcion.id_funcion) if funcion else url_for('admin_funciones.crear_funcion') }}" method="POST">
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label" style="color: #ccc;">ID de la Película</label>
                                <input type="number" name="pelicula_id" class="form-control bg-dark text-white border-secondary" value="{{ funcion.id_pelicula if funcion else '' }}" placeholder="Ej: 1" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label" style="color: #ccc;">ID de la Sala</label>
                                <input type="number" name="sala_id" class="form-control bg-dark text-white border-secondary" value="{{ funcion.id_sala if funcion else '' }}" placeholder="Ej: 3" required>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label" style="color: #ccc;">Fecha</label>
                                <input type="date" name="fecha" class="form-control bg-dark text-white border-secondary" value="{{ funcion.inicio.split('T')[0] if funcion else '' }}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label" style="color: #ccc;">Hora</label>
                                <input type="time" name="hora" class="form-control bg-dark text-white border-secondary" value="{{ funcion.inicio.split('T')[1][:5] if funcion else '' }}" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label" style="color: #ccc;">Formato</label>
                            <select name="idioma" class="form-select bg-dark text-white border-secondary" required>
                                <option value="" disabled {{ '' if funcion else 'selected' }}>Seleccioná el formato...</option>
                                <option value="2D" {{ 'selected' if funcion and funcion.formato == '2D' else '' }}>2D</option>
                                <option value="3D" {{ 'selected' if funcion and funcion.formato == '3D' else '' }}>3D</option>
                                <option value="4D" {{ 'selected' if funcion and funcion.formato == '4D' else '' }}>4D</option>
                            </select>
                        </div>
                        
                        <div class="d-flex justify-content-end mt-2">
                            <a href="/admin/funciones/" class="btn btn-outline-light me-2">Cancelar</a>
                            <button type="submit" class="btn btn-danger" style="background-color: #e50914; border: none;">Guardar Cambios</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
