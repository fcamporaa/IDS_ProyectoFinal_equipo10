        - medio_pago
      properties:
        id_funcion:
          type: integer
          example: 101
        butacas_ids:
          type: array
          items:
            type: integer
          minItems: 1
          example: [15, 16]
        servicios:
          type: array
          items:
            $ref: '#/components/schemas/ItemServicioCompraRequest'
          example:
            - id_servicio: 1
              cantidad: 2
        medio_pago:
          type: string
          example: 'TARJETA_CREDITO'
        email_comprobante:
          type: string
          format: email
          example: 'comprador@gmail.com'

    CompraConfirmadaRespuesta:
      type: object
