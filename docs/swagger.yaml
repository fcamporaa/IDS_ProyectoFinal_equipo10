          type: string
          format: date-time
          example: '2026-11-15T20:00:00'
        cantidad_entradas:
          type: integer
          example: 2
        total:
          type: number
          format: float
          example: 15400.00
        estado:
          type: string
          enum: ['PENDIENTE', 'PAGADA', 'CANCELADA']
          example: 'PAGADA'
        creada_en:
          type: string
          format: date-time
          example: '2026-11-12T14:22:00'

    ItemServicioDetalle:
