openapi: 3.0.3
info:
  title: Cine Paradiso API - Proyecto Integrador IDS 2026
  description: |
    API REST para el sistema de venta de entradas y gestión de cines de Cine Paradiso.
    Cátedra Lanzillotta - Introducción al Desarrollo de Software (2do cuatrimestre 2026).
    Documentación generada en base a `Listado de endpoints.pdf`, `Proyecto integrador IDS 2026.pdf`
    y el esquema relacional de base de datos MySQL (`init_db.sql`).

    **Notas de diseño y convenciones REST:**
    - Se utilizan identificadores de ruta sin tildes ni caracteres especiales (`/generos`, `/dashboard/ocupacion`, `/resenas`) para mantener compatibilidad universal con clientes HTTP.
    - Las fechas y horas se manejan unificadas en formato ISO 8601 / DATETIME (`YYYY-MM-DDTHH:MM:SS`), cumpliendo con la restricción de diseño de base de datos.
    - La estructura de error sigue el estándar unificado `construir_error_api` con un array `errors`.
  version: 1.0.0

servers:
  - url: http://localhost:5000
    description: Servidor de desarrollo local

tags:
  - name: Autenticación y Usuarios
    description: Gestión de registro, inicio de sesión y perfil de usuarios (Clientes y Administradores).
  - name: Películas y Géneros
    description: Consulta y administración del catálogo de películas, géneros y búsqueda externa (OMDb / TMDb).
  - name: Locales, Salas y Butacas
    description: Complejos de cines, infraestructura de salas y distribución física de butacas.
  - name: Funciones
    description: Programación y consulta de funciones de cine, horarios y mapa de butacas en tiempo real.
  - name: Servicios Adicionales
    description: Venta y administración de servicios complementarios (comida, bebidas, etc.).
  - name: Compras y Entradas
    description: Proceso transaccional de compra, emisión de QR/comprobante, historial y cancelaciones.
  - name: Validación de Ingreso
    description: Control de acceso al cine mediante escaneo y auditoría de códigos QR.
  - name: Backoffice Dashboard
    description: Reportes y métricas de negocio para la administración del cine.

paths:
  # =========================================================================
  # 1. Autenticación y Usuarios
  # =========================================================================
  /auth/register:
    post:
      tags:
        - Autenticación y Usuarios
      summary: Registra a un nuevo cliente
      description: Permite a un nuevo visitante registrarse en el sistema con rol CLIENTE.
      operationId: registrarCliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroRequest'
      responses:
        '201':
          description: Cliente registrado con éxito.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioPerfil'
        '400':
          $ref: '#/components/responses/ErrorValidacion'
        '409':
          description: El email o número de socio ya se encuentra registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'

  /auth/login:
    post:
      tags:
        - Autenticación y Usuarios
      summary: Autentica a un usuario
      description: Verifica credenciales (email y contraseña) y retorna los datos de sesión y token de autenticación.
      operationId: loginUsuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Autenticación exitosa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginRespuesta'
        '400':
          $ref: '#/components/responses/ErrorValidacion'
        '401':
          description: Credenciales inválidas o usuario inactivo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'

  /auth/me:
    get:
      tags:
        - Autenticación y Usuarios
      summary: Perfil del usuario logueado
      description: Retorna la información personal y rol del usuario actualmente autenticado.
      operationId: obtenerPerfilActual
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Datos del perfil del usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioPerfil'
        '401':
          $ref: '#/components/responses/NoAutorizado'

    put:
      tags:
        - Autenticación y Usuarios
      summary: Actualiza perfil o contraseña
      description: Permite al usuario logueado modificar su nombre, email o contraseña actual.
      operationId: actualizarPerfilActual
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarPerfilRequest'
      responses:
        '200':
          description: Perfil actualizado correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioPerfil'
        '400':
          $ref: '#/components/responses/ErrorValidacion'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/ProhibidoAdmin'
        '409':
          description: El nuevo email ya está en uso por otra cuenta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'

  # =========================================================================
  # 2. Películas y Géneros
  # =========================================================================
  /peliculas:
    get:
      tags:
        - Películas y Géneros
      summary: Lista la cartelera vigente
      description: Obtiene el listado de películas activas que tienen al menos una función vigente (programada o en curso), ordenadas por título. Es un endpoint público.
      operationId: listarCartelera
      parameters:
        - name: id_genero
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: Filtrar películas por ID de género (entero positivo).
        - name: titulo
          in: query
          required: false
          schema:
            type: string
            maxLength: 250
          description: Búsqueda parcial por título (máximo 250 caracteres).
        - name: clasificacion
          in: query
          required: false
          schema:
            type: string
            maxLength: 20
          description: Filtrar por clasificación (ej. ATP, +13, +16, +18). Máximo 20 caracteres.
      responses:
        '200':
          description: Listado de películas en cartelera.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PeliculaItem'
        '400':
          $ref: '#/components/responses/ErrorValidacion'

    post:
      tags:
        - Películas y Géneros
      summary: Guarda una película nueva (Solo Admin)
      description: >-
        Registra una nueva película en la base local y asocia sus géneros en una sola transacción.
        Responde 400 si los datos son inválidos, si algún id de género no existe
        (error.validacion.generos_inexistentes) o si ya existe una película con el mismo origen_api e id_api
        (error.validacion.pelicula_duplicada); en ese caso el mensaje indica cómo reactivarla si está dada de baja.
      operationId: crearPelicula
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeliculaCrearRequest'
      responses:
        '201':
          description: Película creada con éxito.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeliculaDetalle'
        '400':
          $ref: '#/components/responses/ErrorValidacion'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          description: El usuario autenticado no tiene rol CLIENTE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '403':
          $ref: '#/components/responses/ProhibidoAdmin'

  /peliculas/admin:
    get:
      tags:
        - Películas y Géneros
      summary: Lista todas las películas para el ABM (Solo Admin)
      description: Devuelve todas las películas, activas e inactivas, con sus géneros. Ordena primero las activas y luego por título.
      operationId: listarPeliculasAdmin
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Listado completo de películas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PeliculaDetalle'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/ProhibidoAdmin'

  /peliculas/{id}:
    get:
      tags:
        - Películas y Géneros
      summary: Muestra el detalle de una película y sus funciones vigentes
      description: Retorna sinopsis, tráiler, póster, géneros y las funciones vigentes de esta película. Es un endpoint público y también devuelve las películas dadas de baja; el campo activa indica su estado.
      operationId: obtenerPeliculaDetalle
      parameters:
        - $ref: '#/components/parameters/PeliculaId'
      responses:
        '200':
          description: Detalle de la película con sus funciones.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeliculaConFunciones'
        '404':
          $ref: '#/components/responses/RecursoNoEncontrado'

    put:
      tags:
        - Películas y Géneros
      summary: Modifica los datos de una película existente (Solo Admin)
      description: >-
        Modificación parcial de una película: se envían solo los campos a cambiar y debe venir al menos uno.
        Con activa en true se reactiva una película dada de baja. Si se envía generos_ids, reemplaza los géneros asociados.
        Los campos origen_api e id_api no se modifican: si se envían, se ignoran.
      operationId: actualizarPelicula
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PeliculaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeliculaActualizarRequest'
      responses:
        '200':
          description: Película actualizada correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeliculaDetalle'
        '400':
          $ref: '#/components/responses/ErrorValidacion'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/ProhibidoAdmin'
        '404':
          $ref: '#/components/responses/RecursoNoEncontrado'

    delete:
      tags:
        - Películas y Géneros
      summary: Da de baja una película de la cartelera (Solo Admin)
      description: Marca la película como inactiva (baja lógica). Si ya estaba dada de baja, responde 200 igualmente.
      operationId: eliminarPelicula
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PeliculaId'
      responses:
        '200':
          description: Película dada de baja exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje:
                    type: string
                    example: Película dada de baja con éxito.
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/ProhibidoAdmin'
        '404':
          $ref: '#/components/responses/RecursoNoEncontrado'

  /peliculas/externas/buscar:
    get:
      tags:
        - Películas y Géneros
      summary: Busca películas clásicas en API externa (Solo Admin)
      description: >-
        Consulta OMDb por título (solo películas) para previsualizar datos antes de incorporarlos a la cartelera.
        Si OMDb no encuentra resultados, responde 200 con una lista vacía.
        Responde 502 si OMDb no está disponible o devuelve un error, y 500 si falta la clave OMDB_API_KEY en el servidor.
      operationId: buscarPeliculasExternas
      security:
        - BearerAuth: []
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            maxLength: 100
          description: Nombre o palabra clave de la película a buscar (máximo 100 caracteres).
        - name: titulo
          in: query
          required: false
          deprecated: true
          schema:
            type: string
            maxLength: 100
          description: Alias de query por compatibilidad. Solo se usa si no se envía query.
      responses:
        '200':
          description: Resultados obtenidos desde la API externa.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PeliculaExternaItem'
        '400':
          $ref: '#/components/responses/ErrorValidacion'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/ProhibidoAdmin'
        '500':
          $ref: '#/components/responses/ConfiguracionIncompleta'
        '502':
          $ref: '#/components/responses/ApiExternaNoDisponible'

  /peliculas/externas/{id_api}:
    get:
      tags:
        - Películas y Géneros
      summary: Detalle de una película de OMDb para precargar la ficha (Solo Admin)
      description: >-
        Consulta OMDb por identificador y devuelve los datos normalizados para precargar el formulario del backoffice.
        Los campos que OMDb no informa se devuelven en null.
        Responde 404 si OMDb no encuentra la película, 502 si OMDb no está disponible o devuelve un error,
        y 500 si falta la clave OMDB_API_KEY en el servidor.
      operationId: obtenerPeliculaExterna
      security:
        - BearerAuth: []
      parameters:
        - name: id_api
          in: path
          required: true
          schema:
            type: string
            maxLength: 50
          description: Identificador de la película en OMDb.
          example: tt0068646
      responses:
        '200':
          description: Detalle de la película en OMDb.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeliculaExternaDetalle'
        '400':
          $ref: '#/components/responses/ErrorValidacion'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/ProhibidoAdmin'
        '404':
          $ref: '#/components/responses/RecursoNoEncontrado'
        '500':
          $ref: '#/components/responses/ConfiguracionIncompleta'
        '502':
          $ref: '#/components/responses/ApiExternaNoDisponible'

  /generos:
    get:
      tags:
        - Películas y Géneros
      summary: Lista todos los géneros cinematográficos disponibles
      description: Devuelve la lista completa de géneros (Acción, Comedia, Drama, etc.).
      operationId: listarGeneros
      responses:
        '200':
          description: Lista de géneros.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Genero'

  /peliculas/{id}/resenas:
    get:
      tags:
        - Películas y Géneros
      summary: Lista reseñas y puntuaciones de una película
      description: Retorna las puntuaciones (1 a 5) y comentarios dejados por usuarios verificados para una película.
      operationId: listarResenasPelicula
      parameters:
        - $ref: '#/components/parameters/PeliculaId'
      responses:
        '200':
          description: Listado de reseñas de la película.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResenaItem'
        '404':
          $ref: '#/components/responses/RecursoNoEncontrado'

    post:
      tags:
        - Películas y Géneros
      summary: Registra una puntuación y reseña
      description: Permite registrar una puntuación (1 a 5) y comentario, validando que el usuario tenga una compra para esa película con el QR validado.
      operationId: crearResenaPelicula
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PeliculaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResenaCrearRequest'
      responses:
        '201':
          description: Reseña publicada con éxito.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResenaItem'
        '400':
          $ref: '#/components/responses/ErrorValidacion'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          description: El usuario no posee una compra con QR validado para esta película.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'

  # =========================================================================
  # 3. Locales, Salas y Butacas
  # =========================================================================
  /locales:
    get:
      tags:
        - Locales, Salas y Butacas
      summary: Lista los 3 complejos de cine disponibles
      description: Devuelve los centros de entretenimiento (locales) activos de Cine Paradiso.
      operationId: listarLocales
      responses:
        '200':
          description: Lista de complejos de cine.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Local'

  /locales/{id}/salas:
    get:
      tags:
        - Locales, Salas y Butacas
      summary: Lista las salas de un complejo específico y su capacidad
      description: Retorna todas las salas pertenecientes al complejo indicado, incluyendo cantidad de butacas activas.
      operationId: listarSalasPorLocal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID del complejo de cine.
      responses:
        '200':
          description: Lista de salas del complejo.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SalaResumen'
        '404':
          $ref: '#/components/responses/RecursoNoEncontrado'

    post:
      tags:
        - Locales, Salas y Butacas
      summary: Crea una sala con su grilla de butacas (Solo Admin)
      description: >
        Alta de sala en el complejo indicado. Genera butacas activas según
        `filas` (letras A..Z) y `asientos_por_fila` en una única transacción.
        El número de sala debe ser único dentro del complejo.
      operationId: crearSala
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID del complejo de cine.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalaCrearRequest'
      responses:
        '201':
          description: Sala creada con su distribución de butacas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalaConButacas'
        '400':
          $ref: '#/components/responses/ErrorValidacion'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/ProhibidoAdmin'
        '404':
          $ref: '#/components/responses/RecursoNoEncontrado'
        '409':
          description: Ya existe una sala con ese número en el complejo, o el complejo está inactivo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'

  /salas/admin:
    get:
      tags:
        - Locales, Salas y Butacas
      summary: Lista todas las salas para el ABM (Solo Admin)
      description: Retorna salas activas e inactivas con el nombre del complejo y la capacidad calculada.
      operationId: listarSalasAdmin
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Listado administrativo de salas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SalaAdminItem'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/ProhibidoAdmin'

  /salas/{id}:
    get:
      tags:
        - Locales, Salas y Butacas
      summary: Detalle de una sala y distribución física de butacas
      description: Retorna el número de sala, estado y el mapa físico de filas y columnas de butacas.
      operationId: obtenerDetalleSala
      parameters:
        - $ref: '#/components/parameters/SalaId'
      responses:
        '200':
          description: Detalle de la sala y estructura de butacas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalaConButacas'
        '404':
          $ref: '#/components/responses/RecursoNoEncontrado'

    put:
      tags:
        - Locales, Salas y Butacas
      summary: Habilita/deshabilita una sala o actualiza su configuración (Solo Admin)
      description: Permite dar de baja lógica o actualizar los atributos de una sala.
      operationId: actualizarSala
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SalaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalaActualizarRequest'
      responses:
        '200':
          description: Sala actualizada exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalaResumen'
        '400':
          $ref: '#/components/responses/ErrorValidacion'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/ProhibidoAdmin'
        '404':
          $ref: '#/components/responses/RecursoNoEncontrado'
        '409':
          description: Conflicto de número de sala duplicado en el mismo complejo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'

  /salas/{id}/butacas:
    post:
      tags:
        - Locales, Salas y Butacas
      summary: Genera butacas para una sala vacía (Solo Admin)
      description: >
        Crea la grilla física de butacas cuando la sala aún no tiene asientos.
        Falla con 409 si la sala ya tiene butacas registradas.
      operationId: generarButacasSala
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SalaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ButacasGenerarRequest'
      responses:
        '201':
          description: Butacas generadas; retorna el detalle de la sala.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalaConButacas'
        '400':
          $ref: '#/components/responses/ErrorValidacion'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/ProhibidoAdmin'
        '404':
          $ref: '#/components/responses/RecursoNoEncontrado'
        '409':
          description: La sala ya tiene butacas o hay coordenadas duplicadas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'

  # =========================================================================
  # 4. Funciones
  # =========================================================================
  /funciones:
    get:
      tags:
        - Funciones
      summary: Lista las funciones programadas
      description: Consulta el cronograma de funciones vigentes con filtros opcionales por fecha, película, local o formato.
      operationId: listarFunciones
      parameters:
        - name: id_pelicula
          in: query
          required: false
          schema:
            type: integer
          description: Filtrar por ID de película.
        - name: id_local
          in: query
          required: false
          schema:
            type: integer
          description: Filtrar por ID de complejo de cine.
        - name: fecha
          in: query
          required: false
          schema:
            type: string
            format: date
          example: '2026-11-15'
          description: Filtrar funciones para un día específico (YYYY-MM-DD).
        - name: formato
          in: query
          required: false
          schema:
            type: string
            enum: ['2D', '3D', '4D']
      responses:
        '200':
          description: Cronograma de funciones.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FuncionItem'

    post:
      tags:
        - Funciones
      summary: Programa una nueva función (Solo Admin)
      description: Programa una nueva función validando que el horario y la sala estén disponibles (sin superposiciones) y crea las entradas correspondientes.
      operationId: crearFuncion
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FuncionCrearRequest'
      responses:
        '201':
          description: Función programada con éxito.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FuncionItem'
        '400':
          $ref: '#/components/responses/ErrorValidacion'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/ProhibidoAdmin'
        '409':
          description: Conflicto de horario. La sala ya tiene una función asignada en esa franja horaria.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'

  /funciones/admin:
    get:
      tags:
        - Funciones
      summary: Lista todas las funciones para el ABM (Solo Admin)
      description: Retorna el listado completo de funciones incluyendo canceladas y finalizadas ordenadas por inicio descendente.
      operationId: listarFuncionesAdmin
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Listado completo de funciones.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FuncionItem'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/ProhibidoAdmin'

  /funciones/{id}:
    put:
      tags:
        - Funciones
      summary: Modifica la programación, el precio o el estado de una función (Solo Admin)
      description: Actualiza los campos editables de una función programada, recalculando el fin según la película y validando que no colisione con otras funciones de la sala.
      operationId: actualizarFuncion
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FuncionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FuncionActualizarRequest'
      responses:
        '200':
          description: Función actualizada exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FuncionItem'
        '400':
          $ref: '#/components/responses/ErrorValidacion'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/ProhibidoAdmin'
        '404':
          $ref: '#/components/responses/RecursoNoEncontrado'
        '409':
          description: Conflicto de horario o cambio incompatible con entradas ya vendidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'

    delete:
      tags:
        - Funciones
      summary: Cancela o da de baja una función programada (Solo Admin)
      description: Cancela la función siempre y cuando no posea entradas activas vendidas.
      operationId: eliminarFuncion
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FuncionId'
      responses:
        '200':
          description: Función cancelada o eliminada con éxito.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje:
                    type: string
                    example: Función dada de baja con éxito.
        '400':
          description: No es posible dar de baja una función con entradas ya vendidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/ProhibidoAdmin'
        '404':
          $ref: '#/components/responses/RecursoNoEncontrado'

  /funciones/{id}/butacas:
    get:
      tags:
        - Funciones
      summary: Mapa de butacas libres y ocupadas de la función
      description: Devuelve la grilla completa de butacas de la sala asignada a la función, indicando el estado en tiempo real (DISPONIBLE, OCUPADA, RESERVADA).
      operationId: obtenerMapaButacasFuncion
      parameters:
        - $ref: '#/components/parameters/FuncionId'
      responses:
        '200':
          description: Mapa de butacas de la función.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapaButacasFuncion'
        '404':
          $ref: '#/components/responses/RecursoNoEncontrado'

  # =========================================================================
  # 5. Servicios Adicionales
  # =========================================================================
  /servicios:
    get:
      tags:
        - Servicios Adicionales
      summary: Lista los servicios adicionales activos
      description: Retorna servicios disponibles para todas las salas (comida, bebidas, combos de pochoclos, etc.).
      operationId: listarServicios
      responses:
        '200':
          description: Lista de servicios activos.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Servicio'

    post:
      tags:
        - Servicios Adicionales
      summary: Crea un nuevo servicio adicional (Solo Admin)
      description: Registra un producto o servicio adicional (tipo COMIDA, BEBIDA, OBJETO, PROMOCION o COMBO).
      operationId: crearServicio
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServicioCrearRequest'
      responses:
        '201':
          description: Servicio creado con éxito.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Servicio'
        '400':
          $ref: '#/components/responses/ErrorValidacion'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/ProhibidoAdmin'

  /servicios/{id}:
    get:
      tags:
        - Servicios Adicionales
      summary: Obtiene el detalle de un servicio activo
      description: Retorna los datos del servicio, incluida su URL de imagen.
      operationId: obtenerServicio
      parameters:
        - $ref: '#/components/parameters/ServicioId'
      responses:
        '200':
          description: Detalle del servicio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Servicio'
        '404':
          $ref: '#/components/responses/RecursoNoEncontrado'

    put:
      tags:
        - Servicios Adicionales
      summary: Modifica los datos de un servicio (Solo Admin)
      description: Actualiza los campos enviados, incluida imagen_url; null o texto vacío limpian la imagen.
      operationId: actualizarServicio
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServicioId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServicioActualizarRequest'
      responses:
        '200':
          description: Servicio actualizado correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Servicio'
        '400':
          $ref: '#/components/responses/ErrorValidacion'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/ProhibidoAdmin'
        '404':
          $ref: '#/components/responses/RecursoNoEncontrado'

    patch:
      tags:
        - Servicios Adicionales
      summary: Actualiza parcialmente un servicio (Solo Admin)
      description: Actualiza los campos enviados; null o texto vacío limpian imagen_url.
      operationId: actualizarParcialmenteServicio
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServicioId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServicioActualizarRequest'
      responses:
        '200':
          description: Servicio actualizado correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Servicio'
        '400':
          $ref: '#/components/responses/ErrorValidacion'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/ProhibidoAdmin'
        '404':
          $ref: '#/components/responses/RecursoNoEncontrado'

    delete:
      tags:
        - Servicios Adicionales
      summary: Da de baja un servicio (Solo Admin)
      description: Marca el servicio como inactivo (baja lógica).
      operationId: eliminarServicio
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServicioId'
      responses:
        '200':
          description: Servicio dado de baja con éxito.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje:
                    type: string
                    example: Servicio dado de baja exitosamente.
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/ProhibidoAdmin'
        '404':
          $ref: '#/components/responses/RecursoNoEncontrado'

  # =========================================================================
  # 6. Compras y Entradas
  # =========================================================================
  /compras:
    post:
      tags:
        - Compras y Entradas
      summary: Procesa una nueva compra de entradas y servicios
      description: |
        Realiza la transacción de compra:
        1. Valida que las butacas seleccionadas tengan un token de apartado vigente del cliente.
        2. Calcula el subtotal de entradas y servicios adicionales agregados.
        3. En entorno de desarrollo, simula la aprobación del pago (medio `TARJETA_SIMULADA` y ALLOW_SIMULATED_PAYMENTS=true). NO cobra tarjetas reales.
        4. Guarda la compra y las entradas con transacción, consume los apartados temporales y controla conflictos.
        5. Genera un token QR y prepara el comprobante HTML con QR; el envío SMTP es opcional.
      operationId: procesarCompra
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompraCrearRequest'
      responses:
        '201':
          description: Compra registrada. email_estado informa el resultado de este intento de envío, sin persistencia en MySQL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompraConfirmadaRespuesta'
        '400':
          $ref: '#/components/responses/ErrorValidacion'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          description: El usuario autenticado no tiene rol CLIENTE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '501':
          description: No hay pasarela de pago real; habilitar solo el modo simulado de desarrollo.
        '409':
          description: Una o más butacas seleccionadas ya fueron adquiridas o reservadas por otro usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'

  /compras/reservas:
    post:
      tags:
        - Compras y Entradas
      summary: Aparta temporalmente butacas para el checkout
      description: Aparta en forma atómica las butacas solicitadas durante el tiempo restante de compra, hasta un máximo de 10 minutos.
      operationId: reservarButacasTemporalmente
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_funcion, butacas_ids, token_reserva, duracion_segundos]
              properties:
                id_funcion:
                  type: integer
                  minimum: 1
                butacas_ids:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: integer
                    minimum: 1
                token_reserva:
                  type: string
                  minLength: 32
                  maxLength: 64
                duracion_segundos:
                  type: integer
                  minimum: 1
                  maximum: 600
      responses:
        '201':
          description: Butacas apartadas para el cliente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token_reserva:
                    type: string
                  estado:
                    type: string
                    example: RESERVADA
        '400':
          $ref: '#/components/responses/ErrorValidacion'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          description: El usuario autenticado no tiene rol CLIENTE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '409':
          description: Una o más butacas ya están ocupadas o apartadas por otro cliente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'

  /compras/reservas/{token_reserva}:
    delete:
      tags:
        - Compras y Entradas
      summary: Libera un apartado temporal de butacas
      operationId: liberarReservaTemporal
      security:
        - BearerAuth: []
      parameters:
        - name: token_reserva
          in: path
          required: true
          schema:
            type: string
            minLength: 32
            maxLength: 64
      responses:
        '200':
          description: Apartado liberado.
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          description: El usuario autenticado no tiene rol CLIENTE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'

  /compras/{id}/reenviar-comprobante:
    post:
      tags:
        - Compras y Entradas
      summary: Reintenta el envío del comprobante y QR de una compra pagada del cliente
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CompraId'
      responses:
        '200':
          description: Envío solicitado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje:
                    type: string
                  email_estado:
                    type: string
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '404':
          $ref: '#/components/responses/RecursoNoEncontrado'

  /compras/mis-compras:
    get:
      tags:
        - Compras y Entradas
      summary: Historial de compras del cliente logueado
      description: Retorna todas las compras realizadas por el usuario actual (entradas, funciones y estado).
      operationId: listarMisCompras
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Historial de compras.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompraResumen'
        '401':
          $ref: '#/components/responses/NoAutorizado'

  /compras/{id}:
    get:
      tags:
        - Compras y Entradas
      summary: Detalle completo de una compra
      description: Retorna entradas compradas con su numeración de butaca, servicios asociados, desglose de importes y datos del QR emitido.
      operationId: obtenerDetalleCompra
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CompraId'
      responses:
        '200':
          description: Detalle completo de la compra.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompraDetalle'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          description: No posee autorización para ver compras de otro usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '404':
          $ref: '#/components/responses/RecursoNoEncontrado'

  /compras/{id}/cancelar:
    put:
      tags:
        - Compras y Entradas
      summary: Cancela una compra y libera las butacas
      description: Cancela la compra (pasa a estado CANCELADA), invalida el QR y libera las butacas para que vuelvan a estar disponibles. Solo se permite hasta 24 horas antes del inicio de la función.
      operationId: cancelarCompra
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CompraId'
      responses:
        '200':
          description: Compra cancelada exitosamente y butacas liberadas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje:
                    type: string
                    example: Compra cancelada con éxito. Las butacas han sido liberadas.
                  id_compra:
                    type: integer
                    example: 1042
                  estado:
                    type: string
                    example: CANCELADA
        '400':
          description: La compra está a menos de 24 horas de la función, ya fue utilizada o no está pagada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '404':
          $ref: '#/components/responses/RecursoNoEncontrado'

  # =========================================================================
  # 7. Validación de Ingreso
  # =========================================================================
  /validaciones-qr:
    post:
      tags:
        - Validación de Ingreso
      summary: Escanea y valida un código QR en el acceso a sala (Solo Admin)
      description: |
        Endpoint utilizado en puerta por el personal del cine:
        - Verifica que el QR exista y corresponda a la función y fecha actuales.
        - Verifica que no haya sido cancelado ni utilizado previamente.
        - Marca la compra como utilizada y registra la fecha de validación y auditoría.
      operationId: procesarValidacionQR
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidarQRRequest'
      responses:
        '200':
          description: QR validado exitosamente. Se autoriza el ingreso a la sala.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidarQRRespuesta'
        '400':
          description: Código QR rechazado (ya utilizado, cancelado, función incorrecta o expirado).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/ProhibidoAdmin'

    get:
      tags:
        - Validación de Ingreso
      summary: Historial de validaciones de QR realizadas en puerta (Solo Admin)
      description: Retorna el registro de auditoría de accesos validados, compras asociadas, usuario validador y resultado (EXITO, FALLIDO, REUTILIZADO).
      operationId: listarHistorialValidacionesQR
      security:
        - BearerAuth: []
      parameters:
        - name: id_compra
          in: query
          required: false
          schema:
            type: integer
        - name: resultado
          in: query
          required: false
          schema:
            type: string
            enum: ['EXITO', 'FALLIDO', 'REUTILIZADO']
      responses:
        '200':
          description: Lista de auditoría de validaciones QR.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ValidacionQRItem'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/ProhibidoAdmin'

  # =========================================================================
  # 8. Backoffice Dashboard
