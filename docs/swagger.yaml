        tipo:
          type: string
          enum: ['COMIDA', 'BEBIDA']
          example: 'COMIDA'
        precio:
          type: number
          format: float
          example: 3200.00
        activo:
          type: boolean
          example: true

    ServicioCrearRequest:
      type: object
      required:
        - nombre
        - tipo
        - precio
      properties:
        nombre:
          type: string
          example: 'Estacionamiento 3 Horas'
        tipo:
          type: string
          enum: ['COMIDA', 'BEBIDA']
          example: 'COMIDA'
        precio:
          type: number
          format: float
          example: 2500.00

