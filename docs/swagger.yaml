          example: 'RES-2026-F101-B15'
        estado:
          type: string
          example: 'PAGADA'
        total:
          type: number
          format: float
          example: 15400.00
        qr_token:
          type: string
          example: 'c1f8e6a2-921b-4df2-a1f9-8c9e543b1234'
        email_enviado_a:
          type: string
          example: 'comprador@gmail.com'

    CompraResumen:
      type: object
      properties:
        id_compra:
          type: integer
          example: 1042
        codigo_reserva:
          type: string
          example: 'RES-2026-F101-B15'
        pelicula:
          type: string
