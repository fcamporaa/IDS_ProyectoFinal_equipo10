      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DashboardLocal'
        - $ref: '#/components/parameters/DashboardDesde'
        - $ref: '#/components/parameters/DashboardHasta'
      responses:
        '200':
          description: Recaudación y entradas por género.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VentaPorGenero'
        '400':
          $ref: '#/components/responses/ErrorValidacion'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/ProhibidoAdmin'

  /dashboard/franjas-horarias:
    get:
      tags:
        - Backoffice Dashboard
      summary: Reporte de horarios y turnos con mayor volumen de entradas (Solo Admin)
      description: >
        Identifica las franjas horarias más concurridas del cine agrupando las
        entradas vendidas en los turnos Mañana, Tarde, Noche y Trasnoche.
      operationId: obtenerFranjasHorarias
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DashboardLocal'
        - $ref: '#/components/parameters/DashboardDesde'
        - $ref: '#/components/parameters/DashboardHasta'
      responses:
        '200':
          description: Reporte de volumen por turnos y horarios.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FranjaHorariaVenta'
        '400':
          $ref: '#/components/responses/ErrorValidacion'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/ProhibidoAdmin'

  /dashboard/cancelaciones:
    get:
      tags:
        - Backoffice Dashboard
      summary: Tasa y estadísticas de compras canceladas (Solo Admin)
      description: >
        Reporte de compras canceladas sobre el total de compras PAGADAS o
        CANCELADAS, incluyendo el monto total devuelto.
      operationId: obtenerEstadisticasCancelaciones
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DashboardLocal'
        - $ref: '#/components/parameters/DashboardDesde'
        - $ref: '#/components/parameters/DashboardHasta'
      responses:
        '200':
          description: Estadísticas de cancelaciones.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadisticasCancelacion'
        '400':
          $ref: '#/components/responses/ErrorValidacion'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/ProhibidoAdmin'

  /dashboard/reporte-ventas:
    get:
      tags:
        - Backoffice Dashboard
      summary: Consolidado de ventas por función y ranking de películas (Solo Admin)
      description: Reporte consolidado de ventas, ranking de películas más taquilleras y opción de generación en formato PDF (deseable).
      operationId: obtenerReporteVentasConsolidado
      security:
        - BearerAuth: []
      parameters:
        - name: formato
          in: query
          required: false
          schema:
            type: string
            enum: ['json', 'pdf']
            default: 'json'
          description: Permite solicitar los datos en JSON o descargar el documento en formato PDF.
      responses:
        '200':
          description: Reporte generado en JSON o archivo binario PDF.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReporteVentasConsolidado'
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          $ref: '#/components/responses/ProhibidoAdmin'

# =========================================================================
# Componentes Reutilizables (Schemas, Parameters, Responses, Security)
# =========================================================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de sesión obtenido al autenticarse en `/auth/login`.

  parameters:
    PeliculaId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: ID único de la película.
    SalaId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: ID único de la sala.
    FuncionId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: ID único de la función.
    ServicioId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: ID único del servicio.
    CompraId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: ID único de la compra.
    DashboardLocal:
      name: id_local
      in: query
      required: false
      schema:
        type: integer
      description: Filtra las métricas por complejo.
    DashboardDesde:
      name: desde
      in: query
      required: false
      schema:
        type: string
        format: date
      example: '2026-11-01'
      description: Fecha inicial inclusiva en formato YYYY-MM-DD.
    DashboardHasta:
      name: hasta
      in: query
      required: false
      schema:
        type: string
        format: date
      example: '2026-11-30'
      description: Fecha final inclusiva en formato YYYY-MM-DD.

  responses:
    ErrorValidacion:
      description: Error de validación en los datos enviados en la solicitud (400 Bad Request).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorRespuesta'
    NoAutorizado:
      description: Se requiere autenticación para acceder a este recurso (401 Unauthorized).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorRespuesta'
    ProhibidoAdmin:
      description: El usuario no tiene rol ADMINISTRADOR para ejecutar esta acción (403 Forbidden).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorRespuesta'
    RecursoNoEncontrado:
      description: El recurso solicitado no existe (404 Not Found).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorRespuesta'
    ConfiguracionIncompleta:
      description: Falta una configuración obligatoria en el servidor, por ejemplo la clave OMDB_API_KEY (500 Internal Server Error). La respuesta no expone el valor de la clave.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorRespuesta'
    ApiExternaNoDisponible:
      description: La API externa no respondió, devolvió un formato inválido o respondió con un error (502 Bad Gateway, código error.externo.api_no_disponible).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorRespuesta'

  schemas:
    # --- Estándar de Error de la API ---
    ErrorRespuesta:
      type: object
      required:
        - errors
      properties:
        errors:
          type: array
          items:
            type: object
            required:
              - code
              - message
              - description
            properties:
              code:
                type: string
                example: 'error.validacion.parametro'
              message:
                type: string
                example: 'Dato inválido'
              level:
                type: string
                example: 'error'
              description:
                type: string
                example: 'El campo fecha debe respetar el formato YYYY-MM-DD.'

    # --- Autenticación y Perfil ---
    RegistroRequest:
      type: object
      required:
        - nombre
        - email
        - contrasena
      properties:
        nombre:
          type: string
          example: 'Carlos Bianchi'
        email:
          type: string
          format: email
          example: 'carlos.bianchi@gmail.com'
        contrasena:
          type: string
          format: password
          minLength: 6
          example: 'Cine2026!'
        numero_socio:
          type: string
          example: 'SOC-9821'

    LoginRequest:
      type: object
      required:
        - email
        - contrasena
      properties:
        email:
          type: string
          format: email
          example: 'admin@cineparadiso.com'
        contrasena:
          type: string
          format: password
          example: 'AdminPass2026'

    LoginRespuesta:
      type: object
      properties:
        token:
          type: string
          example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
        usuario:
          $ref: '#/components/schemas/UsuarioPerfil'

    UsuarioPerfil:
      type: object
      properties:
        id_usuario:
          type: integer
          example: 1
        nombre:
          type: string
          example: 'Carlos Bianchi'
        email:
          type: string
          example: 'carlos.bianchi@gmail.com'
        numero_socio:
          type: string
          example: 'SOC-9821'
        rol:
          type: string
          enum: ['CLIENTE', 'ADMINISTRADOR']
          example: 'CLIENTE'
        fecha_registro:
          type: string
          format: date-time
          example: '2026-10-24T18:30:00'
        activo:
          type: boolean
          example: true

    ActualizarPerfilRequest:
      type: object
      properties:
        nombre:
          type: string
          example: 'Carlos A. Bianchi'
        email:
          type: string
          format: email
          example: 'carlos.nuevo@gmail.com'
        contrasena:
          type: string
          format: password
          example: 'NuevaClaveSegura2026'

    # --- Películas y Géneros ---
    Genero:
      type: object
      properties:
        id_genero:
          type: integer
          example: 3
        nombre:
          type: string
          example: 'Ciencia Ficción'

    PeliculaItem:
      type: object
      properties:
        id_pelicula:
          type: integer
          example: 10
        titulo:
          type: string
          example: 'Back to the Future'
        sinopsis:
          type: string
          example: 'Marty McFly viaja al año 1955 en una máquina del tiempo construida por el Dr. Emmett Brown.'
        poster_url:
          type: string
          format: uri
          example: 'https://image.tmdb.org/t/p/w500/back_to_the_future.jpg'
        trailer_url:
          type: string
          format: uri
          example: 'https://youtube.com/watch?v=qvsgGtivCgs'
        duracion_min:
          type: integer
          example: 116
        clasificacion:
          type: string
          example: 'ATP'
        anio_estreno:
          type: integer
          example: 1985
        activa:
          type: boolean
          example: true
        generos:
          type: array
          items:
            $ref: '#/components/schemas/Genero'

    PeliculaDetalle:
      allOf:
        - $ref: '#/components/schemas/PeliculaItem'
        - type: object
          properties:
            origen_api:
              type: string
              enum: ['OMDB', 'TMDB', 'CUSTOM']
              example: 'TMDB'
            id_api:
              type: string
              example: 'tt0088763'

    PeliculaConFunciones:
      allOf:
        - $ref: '#/components/schemas/PeliculaDetalle'
        - type: object
          properties:
            funciones_vigentes:
              type: array
              items:
                $ref: '#/components/schemas/FuncionItem'

    PeliculaCrearRequest:
      type: object
      required:
        - titulo
        - origen_api
        - generos_ids
        - duracion_min
      properties:
        titulo:
          type: string
          minLength: 1
          maxLength: 250
          example: 'Pulp Fiction'
        sinopsis:
          type: string
          maxLength: 10000
          example: 'Historias entrelazadas en los bajos fondos de Los Ángeles.'
        poster_url:
          type: string
          maxLength: 1000
          example: 'https://image.tmdb.org/pulp_fiction.jpg'
        trailer_url:
          type: string
          maxLength: 1000
          example: 'https://youtube.com/watch?v=s7EdQ4FqbhY'
        duracion_min:
          type: integer
          minimum: 1
          maximum: 32767
          example: 154
        clasificacion:
          type: string
          maxLength: 20
          example: '+18'
        anio_estreno:
          type: integer
          minimum: 1888
          description: Desde 1888 hasta el año actual más 5.
          example: 1994
        origen_api:
          type: string
          enum: ['OMDB', 'TMDB', 'CUSTOM']
          example: 'OMDB'
        id_api:
          type: string
          maxLength: 50
          description: Obligatorio cuando origen_api no es CUSTOM.
          example: 'tt0110912'
        generos_ids:
          type: array
          minItems: 1
          description: Ids de géneros existentes. Los ids repetidos se eliminan.
          items:
            type: integer
            minimum: 1
          example: [1, 4]

    PeliculaActualizarRequest:
      type: object
      minProperties: 1
      description: Todos los campos son opcionales, pero debe enviarse al menos uno. Los campos desconocidos (por ejemplo origen_api o id_api) se ignoran.
      properties:
        titulo:
          type: string
          minLength: 1
          maxLength: 250
        sinopsis:
          type: string
          maxLength: 10000
        poster_url:
          type: string
          maxLength: 1000
        trailer_url:
          type: string
          maxLength: 1000
        duracion_min:
          type: integer
          minimum: 1
          maximum: 32767
        clasificacion:
          type: string
          maxLength: 20
        anio_estreno:
          type: integer
          minimum: 1888
        activa:
          type: boolean
          description: Con true reactiva una película dada de baja.
        generos_ids:
          type: array
          minItems: 1
          description: Reemplaza todos los géneros asociados a la película.
          items:
            type: integer
            minimum: 1

    PeliculaExternaItem:
      type: object
      properties:
        id_api:
          type: string
          example: 'tt0068646'
        titulo:
          type: string
          example: 'The Godfather'
        anio:
          type: integer
          nullable: true
          example: 1972
        poster:
          type: string
          nullable: true
          example: 'https://m.media-amazon.com/images/M/godfather.jpg'
        origen:
          type: string
          enum: ['OMDB']
          example: 'OMDB'

    PeliculaExternaDetalle:
      type: object
      description: Ficha de OMDb normalizada. Los campos que OMDb no informa son null.
      properties:
        id_api:
          type: string
          example: 'tt0068646'
        titulo:
          type: string
          nullable: true
          example: 'The Godfather'
        anio_estreno:
          type: integer
          nullable: true
          example: 1972
        poster_url:
          type: string
          nullable: true
          example: 'https://m.media-amazon.com/images/M/godfather.jpg'
        sinopsis:
          type: string
          nullable: true
        duracion_min:
          type: integer
          nullable: true
          example: 175
        clasificacion:
          type: string
          nullable: true
          example: 'R'
        generos:
          type: array
          description: Nombres de género tal como los informa OMDb (en inglés). El backoffice los mapea a los géneros locales.
          items:
            type: string
          example: ['Crime', 'Drama']
        origen_api:
          type: string
          enum: ['OMDB']
          example: 'OMDB'

    ResenaItem:
      type: object
      properties:
        id_resena:
          type: integer
          example: 5
        id_usuario:
          type: integer
          example: 12
        nombre_usuario:
          type: string
          example: 'Martín Palermo'
        puntuacion:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        comentario:
          type: string
          example: 'Excelente calidad de imagen en la sala 2, película clásica imperdible.'
        creada_en:
          type: string
          format: date-time
          example: '2026-11-10T22:30:00'

    ResenaCrearRequest:
      type: object
      required:
        - puntuacion
        - id_compra
      properties:
        id_compra:
          type: integer
          description: ID de la compra correspondiente donde ya se validó el QR.
          example: 1042
        puntuacion:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        comentario:
          type: string
          example: 'Excelente sonido y butacas muy cómodas.'

    # --- Locales y Salas ---
    Local:
      type: object
      properties:
        id_local:
          type: integer
          example: 1
        nombre:
          type: string
          example: 'Cine Paradiso Abasto'
        direccion:
          type: string
          example: 'Av. Corrientes 3247, CABA'
        activo:
          type: boolean
          example: true

    SalaResumen:
      type: object
      properties:
        id_sala:
          type: integer
          example: 2
        id_local:
          type: integer
          example: 1
        numero:
          type: integer
          example: 2
        capacidad:
          type: integer
          example: 80
        activa:
          type: boolean
          example: true

    SalaAdminItem:
      allOf:
        - $ref: '#/components/schemas/SalaResumen'
        - type: object
          properties:
            nombre_local:
              type: string
              example: 'Cine Paradiso Palermo'

    SalaCrearRequest:
      type: object
      required:
        - numero
        - filas
        - asientos_por_fila
      properties:
        numero:
          type: integer
          minimum: 1
          maximum: 32767
          example: 3
        filas:
          type: integer
          minimum: 1
          maximum: 26
          description: Cantidad de filas (A=1 ... Z=26).
          example: 4
        asientos_por_fila:
          type: integer
          minimum: 1
          maximum: 30
          example: 8
        activa:
          type: boolean
          default: true
          example: true

    SalaActualizarRequest:
      type: object
      properties:
        numero:
          type: integer
          minimum: 1
          maximum: 32767
          example: 2
        activa:
          type: boolean
          example: true

    ButacasGenerarRequest:
      type: object
      required:
        - filas
        - asientos_por_fila
      properties:
        filas:
          type: integer
          minimum: 1
          maximum: 26
          example: 3
        asientos_por_fila:
          type: integer
          minimum: 1
          maximum: 30
          example: 6

    Butaca:
      type: object
      properties:
        id_butaca:
          type: integer
          example: 15
        id_sala:
          type: integer
          example: 2
        fila:
          type: string
          example: 'C'
        numero:
          type: integer
          example: 4
        activa:
          type: boolean
          example: true

    SalaConButacas:
      allOf:
        - $ref: '#/components/schemas/SalaResumen'
        - type: object
          properties:
            butacas:
              type: array
              items:
                $ref: '#/components/schemas/Butaca'

    # --- Funciones ---
    FuncionItem:
      type: object
      properties:
        id_funcion:
          type: integer
          example: 101
        id_pelicula:
          type: integer
          example: 10
        titulo_pelicula:
          type: string
          example: 'Back to the Future'
        id_sala:
          type: integer
          example: 2
        numero_sala:
          type: integer
          example: 2
        nombre_local:
          type: string
          example: 'Cine Paradiso Abasto'
        inicio:
          type: string
          format: date-time
          example: '2026-11-15T20:00:00'
        fin:
          type: string
          format: date-time
          example: '2026-11-15T22:15:00'
        formato:
          type: string
          enum: ['2D', '3D', '4D']
          example: '2D'
        idioma:
          type: string
          example: 'Inglés'
        subtitulada:
          type: boolean
          example: true
        precio_entrada:
          type: number
          format: float
          example: 4500.00
        estado:
          type: string
          enum: ['PROGRAMADA', 'EN_CURSO', 'CANCELADA', 'FINALIZADA']
          example: 'PROGRAMADA'

    FuncionCrearRequest:
      type: object
      required:
        - id_pelicula
        - id_sala
        - inicio
        - formato
        - precio_entrada
      properties:
        id_pelicula:
          type: integer
          example: 10
        id_sala:
          type: integer
          example: 2
        inicio:
          type: string
          format: date-time
          example: '2026-11-15T20:00:00'
        formato:
          type: string
          enum: ['2D', '3D', '4D']
          example: '2D'
        idioma:
          type: string
          example: 'Inglés'
        subtitulada:
          type: boolean
          example: true
        precio_entrada:
          type: number
          format: float
          example: 4500.00

    FuncionActualizarRequest:
      type: object
      properties:
        id_pelicula:
          type: integer
          example: 10
        id_sala:
          type: integer
          example: 2
        inicio:
          type: string
          format: date-time
          example: '2026-11-15T20:30:00'
        formato:
          type: string
          enum: ['2D', '3D', '4D']
          example: '2D'
        idioma:
          type: string
          example: 'Español'
        subtitulada:
          type: boolean
          example: false
        precio_entrada:
          type: number
          format: float
          example: 4800.00
        estado:
          type: string
          enum: ['PROGRAMADA', 'EN_CURSO', 'CANCELADA', 'FINALIZADA']

    ButacaEstadoFuncion:
      type: object
      properties:
        id_butaca:
          type: integer
          example: 15
        fila:
          type: string
          example: 'B'
        numero:
          type: integer
          example: 3
        estado:
          type: string
          enum: ['DISPONIBLE', 'RESERVADA', 'OCUPADA']
          example: 'DISPONIBLE'
        id_entrada:
          type: integer
          nullable: true
          example: 541

    MapaButacasFuncion:
      type: object
      properties:
        id_funcion:
          type: integer
          example: 101
        id_sala:
          type: integer
          example: 2
        total_butacas:
          type: integer
          example: 80
        libres:
          type: integer
          example: 72
        ocupadas:
          type: integer
          example: 8
        butacas:
          type: array
          items:
            $ref: '#/components/schemas/ButacaEstadoFuncion'

    # --- Servicios ---
    Servicio:
      type: object
      properties:
        id_servicio:
          type: integer
          example: 1
        nombre:
          type: string
          example: 'Combo Pochoclos Grande + Gaseosa'
        tipo:
          type: string
          enum: ['COMIDA', 'BEBIDA', 'OBJETO', 'PROMOCION', 'COMBO']
          example: 'COMIDA'
        precio:
          type: number
          format: float
          example: 3200.00
        activo:
          type: boolean
          example: true
        imagen_url:
          type: string
          format: uri
          nullable: true
          description: URL HTTP(S) de la imagen o null si no tiene imagen.
          example: https://cdn.example.com/servicios/pochoclos.jpg

    ServicioCrearRequest:
      type: object
      required:
        - nombre
        - tipo
        - precio
      properties:
        nombre:
          type: string
          example: 'Estacionamiento 3 Horas'
        tipo:
          type: string
          enum: ['COMIDA', 'BEBIDA', 'OBJETO', 'PROMOCION', 'COMBO']
          example: 'COMIDA'
        precio:
          type: number
          format: float
          example: 2500.00
        imagen_url:
          type: string
          format: uri
          nullable: true
          description: URL HTTP(S) de la imagen; puede omitirse, enviarse como null o como texto vacío.
          example: https://cdn.example.com/servicios/estacionamiento.jpg

    ServicioActualizarRequest:
      type: object
      properties:
        nombre:
          type: string
        tipo:
          type: string
          enum: ['COMIDA', 'BEBIDA', 'OBJETO', 'PROMOCION', 'COMBO']
        precio:
          type: number
          format: float
        activo:
          type: boolean
        imagen_url:
          type: string
          format: uri
          nullable: true
          description: URL HTTP(S) de la imagen; null o texto vacío limpian el valor actual.

    # --- Compras y Pagos ---
    ItemServicioCompraRequest:
      type: object
      required:
        - id_servicio
        - cantidad
      properties:
        id_servicio:
          type: integer
          example: 1
        cantidad:
          type: integer
          minimum: 1
          example: 2

    CompraCrearRequest:
      type: object
      required:
        - id_funcion
        - butacas_ids
        - token_reserva
        - medio_pago
      properties:
        id_funcion:
          type: integer
          example: 101
        butacas_ids:
          type: array
          items:
            type: integer
          minItems: 1
          example: [15, 16]
        token_reserva:
          type: string
          minLength: 32
          maxLength: 64
        servicios:
          type: array
          items:
            $ref: '#/components/schemas/ItemServicioCompraRequest'
          example:
            - id_servicio: 1
              cantidad: 2
        medio_pago:
          type: string
          example: 'TARJETA_SIMULADA'
        email_comprobante:
          type: string
          format: email
          example: 'comprador@gmail.com'

    CompraConfirmadaRespuesta:
      type: object
      properties:
        id_compra:
          type: integer
          example: 1042
        codigo_reserva:
          type: string
          example: 'RES-2026-F101-B15'
        estado:
          type: string
          example: 'PAGADA'
        total:
          type: number
          format: float
          example: 15400.00
        qr_token:
          type: string
          example: 'c1f8e6a2-921b-4df2-a1f9-8c9e543b1234'
        email_estado:
          type: string
          enum: [PENDIENTE, ENVIADO, SIMULADO, ERROR]
        email_enviado_a:
          type: string
          example: 'comprador@gmail.com'

    CompraResumen:
      type: object
      properties:
        id_compra:
          type: integer
          example: 1042
        codigo_reserva:
          type: string
          example: 'RES-2026-F101-B15'
        pelicula:
          type: string
          example: 'Back to the Future'
        fecha_funcion:
          type: string
          format: date-time
          example: '2026-11-15T20:00:00'
        cantidad_entradas:
          type: integer
          example: 2
        total:
          type: number
          format: float
          example: 15400.00
        estado:
          type: string
          enum: ['PENDIENTE', 'PAGADA', 'CANCELADA']
          example: 'PAGADA'
        creada_en:
          type: string
          format: date-time
          example: '2026-11-12T14:22:00'

    ItemServicioDetalle:
      type: object
      properties:
        nombre_servicio:
          type: string
          example: 'Combo Pochoclos Grande'
        cantidad:
          type: integer
          example: 2
        precio_unitario:
          type: number
          format: float
          example: 3200.00
        subtotal:
          type: number
          format: float
          example: 6400.00

    EntradaDetalle:
      type: object
      properties:
        id_entrada:
          type: integer
          example: 541
        fila:
          type: string
          example: 'B'
        numero:
