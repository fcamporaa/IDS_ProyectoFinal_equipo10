services:
  # 1. Base de datos MySQL 8.0
  db:
    image: mysql:8.0
    container_name: cine_paradiso_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci --default-time-zone='-03:00'
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-proyecto_integrador}
    ports:
      - "${DB_PORT_EXTERNAL:-3307}:3306"
    volumes:
      - ./backend/db/init_db.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./backend/db/seed_data.sql:/docker-entrypoint-initdb.d/02_seeds.sql:ro
      - cine_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. Servidor Backend (API REST)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cine_paradiso_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Conexión MySQL dentro de la red Docker
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_NAME: ${DB_NAME:-proyecto_integrador}
      DB_SSL: ${DB_SSL:-false}
      # Autenticación y Tokens
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES:-120}
      # API Externa y Pagos
      OMDB_API_KEY: ${OMDB_API_KEY:-}
      ALLOW_SIMULATED_PAYMENTS: ${ALLOW_SIMULATED_PAYMENTS:-true}
      # Configuración de Envío de Emails (SMTP Real / Console)
      EMAIL_MODE: ${EMAIL_MODE:-smtp}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
    ports:
      - "${BACKEND_PORT:-5000}:5000"

  # 3. Servidor Frontend (SSR Flask + Jinja2)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cine_paradiso_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: ${PORT:-5001}
      FLASK_DEBUG: ${FLASK_DEBUG:-False}
      BACKEND_URL: ${BACKEND_URL:-http://backend:5000}
      SECRET_KEY: ${SECRET_KEY:-${FRONTEND_SECRET_KEY}}
    ports:
      - "${PORT:-5001}:5001"

volumes:
  cine_db_data:
